name: Build and Publish adopt-plot to PyPI

on:
  push:
    tags:
      - 'v*'          # Запуск при пуше тега, например, v1.0.0
  workflow_dispatch: # Ручной запуск из Actions

permissions:
  id-token: write    # Необходимо для Trusted Publishing. Если используешь API token — закомментируй!
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package (SDist + Wheel)
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Upload artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Если используешь Trusted Publishing, просто оставь эту секцию как есть.
          # Если используешь API token, закомментируй строку ниже и раскомментируй `password`:
          # password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
